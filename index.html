<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/index.css" rel="stylesheet">
  </head>
  <body>
    <div class="container-fluid bg-dark text-white px-5 py-4">
      <div class="row justify-content-center">
        <div class="col-10 d-flex flex-column flex-wrap">
          <p class="display-3 mb-1">RSS агрегатор</p>
          <p class="lead mb-3">Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form class="form">
            <div class="row gap-2 g-2">
              <div class="form-floating col">
                <input id="url" name="url" type="text" class="form-control-lg form-control" placeholder="Ссылка RSS"/>
                <label for="url">Ссылка RSS</label>
              </div>
              <button class="btn btn-primary btn-lg col-auto" type="submit">Добавить</button>
            </div>
            <p class="form-text text-secondary mb-1">Пример: https://lorem-rss.hexlet.app/feed</p>
            <p class="text-success mb-1 small">RSS успешно загружен</p>
          </form>
        </div>
      </div>
    </div>

    <div class="container-fluid px-5">
      <div class="row justify-content-center">
        <div class="row col-11">

          
          <div class="col-8">
            <p>Посты</p>
            <div class="item">
            </div>
          </div>
          
          <div class="col-4">
            <p>Фиды</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="index.js"></script>
    
  </body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS agregator</title>
</head>

<body>
  <div class="container-fluid bg-dark text-white px-5 py-4">
    <div class="row justify-content-center">
      <div class="col-10 d-flex flex-column flex-wrap">
        <p id="pageTitle" class="display-3 mb-1">RSS агрегатор</p>
        <p id="pageDescription" class="lead mb-3">Начните читать RSS сегодня! Это легко, это красиво.</p>
        <form class="form">
          <div class="row gap-2 g-2">
            <div class="form-floating col">
              <input id="url" name="url" type="text" class="form-control-lg form-control" placeholder="Ссылка RSS" aria-label="url"
                required autocomplete="off" />
              <label id="urlLabel" for="url">Ссылка RSS</label>
            </div>
            <button id="submitButton" class="btn btn-primary btn-lg col-auto" type="submit">Добавить</button>
          </div>
          <p id="exampleText" class="form-text text-secondary mb-1">Пример: https://lorem-rss.hexlet.app/feed</p>
        </form>
      </div>
    </div>
  </div>

  <div class="container-fluid p-5">
    <div class="row justify-content-center">
      <div class="row col-11 gap-4">
        <div class="col-md-7 order-2 order-md-1">
          <p id="postsTitle" class="fw-medium fs-5 mb-4">Посты</p>
          <div id="postsContainer" class="posts d-flex gap-3 flex-column">
          </div>
        </div>

        <div class="col-md-4 order-1 order-md-2">
          <p id="feedsTitle" class="fw-medium fs-5 mb-4">Фиды</p>
          <div id="feedsContainer" class="d-flex gap-3 flex-column feeds">
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="postModalTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="postModalTitle">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="postModalDescription">
          </div>
          <div class="modal-footer">
            <a href="#" class="btn btn-primary"  id="postModalLink" target="_blank">Читать полностью</a>
            <button id="modalCloseButton" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>

</body>

</html>
